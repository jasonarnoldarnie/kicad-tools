<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return Path Report</title>
<!-- Template for return_path_check.py --html; the script replaces the DATA placeholder. -->
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1c1d1f; --muted: #686b73;
  --border: #e1e1dc; --accent: #3e63dd;
  --canvas: #e8ebe5; --substrate: #dde3d9; --outline: #97a396; --plane: #bfcdbb; --plane-alt: #cbc3df;
  --ctx: #8b908b; --pad: #b9a77a; --via: #7d837d;
  --fail: #d13b40; --warn: #b87d00; --ok: #2b8f5a; --info: #3e63dd; --detour: #e8590c; --edge: #e0a100;
  --c-rf: #c2298a; --c-clock: #e8590c; --c-high-speed: #c99400; --c-analog: #0f9488;
  --c-medium: #3e63dd; --c-low-speed: #8e4ec6; --c-static: #7c7f88; --c-unclassified: #a5a8ae;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111213; --surface: #18191b; --surface-2: #212225; --text: #ececee; --muted: #9b9ea6;
    --border: #2d2e32; --accent: #8098ff;
    --canvas: #0b0e0c; --substrate: #121915; --outline: #3f5044; --plane: #1b3325; --plane-alt: #2c2442;
    --ctx: #5b615c; --pad: #6b5d3d; --via: #6a716b;
    --fail: #ff5c61; --warn: #f5b323; --ok: #3dd68c; --info: #8098ff; --detour: #ff8b3e; --edge: #f5c323;
    --c-rf: #f06bc0; --c-clock: #ff8b3e; --c-high-speed: #f5c323; --c-analog: #2ec4b6;
    --c-medium: #8098ff; --c-low-speed: #b98ef0; --c-static: #9b9ea6; --c-unclassified: #6f7278;
  }
}
:root[data-theme="dark"] {
  --bg: #111213; --surface: #18191b; --surface-2: #212225; --text: #ececee; --muted: #9b9ea6;
  --border: #2d2e32; --accent: #8098ff;
  --canvas: #0b0e0c; --substrate: #121915; --outline: #3f5044; --plane: #1b3325; --plane-alt: #2c2442;
  --ctx: #5b615c; --pad: #6b5d3d; --via: #6a716b;
  --fail: #ff5c61; --warn: #f5b323; --ok: #3dd68c; --info: #8098ff; --detour: #ff8b3e; --edge: #f5c323;
  --c-rf: #f06bc0; --c-clock: #ff8b3e; --c-high-speed: #f5c323; --c-analog: #2ec4b6;
  --c-medium: #8098ff; --c-low-speed: #b98ef0; --c-static: #9b9ea6; --c-unclassified: #6f7278;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 2px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
.meta { color: var(--muted); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; }
.tile .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.viewer { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
@media (max-width: 960px) { .viewer { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font: inherit;
  font-size: 12.5px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.toggles label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px;
  padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.board-wrap { position: relative; border-radius: 10px; overflow: hidden; background: var(--canvas);
  border: 1px solid var(--border); }
#board { display: block; width: 100%; height: min(62vh, 640px); min-height: 280px; cursor: grab; touch-action: none; }
#board.dragging { cursor: grabbing; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px #0003;
  display: none; z-index: 10; max-width: 320px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 99px;
  border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
.b-FAIL { color: var(--fail); } .b-WARN { color: var(--warn); } .b-OK { color: var(--ok); } .b-INFO { color: var(--info); }
.cls { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#detail .name { font-weight: 650; font-size: 15px; word-break: break-all; }
.stats { display: grid; grid-template-columns: auto auto; gap: 3px 12px; font-size: 13px; margin: 10px 0; }
.stats dt { color: var(--muted); } .stats dd { margin: 0; text-align: right; }
.issues { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px;
  max-height: 340px; overflow: auto; }
.issues li { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.issues li.go { cursor: pointer; }
.issues li.go:hover { outline: 1px solid var(--accent); }
.issues .kind { font-weight: 650; margin: 0 4px; }
.muted { color: var(--muted); }
.table-card { margin-top: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 99px;
  padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--text); }
.chip .c { color: var(--muted); }
input[type=search] { border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12.5px; min-width: 180px; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0;
  background: var(--surface); }
th.r, td.r { text-align: right; }
th[aria-sort] { color: var(--text); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.ratio { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.bar { width: 70px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.foot { margin-top: 14px; font-size: 12px; color: var(--muted); }
/* board */
#board .outline { fill: var(--substrate); stroke: var(--outline); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#board .plane path { stroke: none; fill-rule: evenodd; }
#board .pad { fill: var(--pad); opacity: .55; }
#board .ctx { stroke: var(--ctx); opacity: .45; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#board .trk { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#board .trk.other { opacity: .22; }
#board .via { fill: var(--via); }
#board .ovl { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#board .ovl-edge { stroke: var(--edge); stroke-width: 7px; opacity: .35; fill: none;
  vector-effect: non-scaling-stroke; stroke-linecap: round; }
#board text { font-family: system-ui, sans-serif; paint-order: stroke; stroke: var(--canvas); stroke-width: 2.5px;
  vector-effect: non-scaling-stroke; pointer-events: none; }
#board .ref { fill: var(--muted); font-size: .8px; text-anchor: middle; dominant-baseline: middle; }
#board .lbl { font-weight: 700; font-size: .9px; }
#board.has-sel [data-net]:not(.sel) { opacity: .1; }
#board.has-sel .trk.sel { filter: drop-shadow(0 0 .25px currentColor); }
#board .marker { fill: none; stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke;
  animation: pulse 1.2s ease-out 3; }
@keyframes pulse { from { opacity: 1; } to { opacity: .2; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Return path report</h1>
    <div class="meta" id="meta"></div>
  </header>
  <section class="tiles" id="tiles"></section>

  <section class="viewer">
    <div class="card">
      <div class="toolbar">
        <div class="seg" id="views" role="group" aria-label="Layer view"></div>
        <div class="seg" id="colorby" role="group" aria-label="Colour by">
          <button data-v="status">Status</button><button data-v="cls">Class</button>
        </div>
        <div class="toggles" id="toggles"></div>
        <button class="btn" id="fit">Fit board</button>
      </div>
      <div class="board-wrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="hint">Scroll to zoom · drag to pan · click a trace to select · viewed from top</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="card" id="detail"></aside>
  </section>

  <section class="card table-card">
    <h2>Per-net summary</h2>
    <div class="filters" id="filters"></div>
    <div class="tscroll"><table id="table"><thead></thead><tbody></tbody></table></div>
    <div class="foot" id="foot"></div>
  </section>
</main>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice = s => esc(String(s).replace(/\{slash\}/g, '/'));
const fmt = (v, d = 2) => v == null ? '–' : Number(v).toFixed(d);
const NETS = Object.fromEntries(D.nets.map(n => [n.net, n]));
const CLASSES = D.meta.classes;
const SEV = { FAIL: 0, WARN: 1, INFO: 2, OK: 3 };
const LAYER_ORDER = l => l === 'F.Cu' ? 0 : l === 'B.Cu' ? 99 : parseInt((l.match(/\d+/) || [50])[0], 10);
const svg = $('#board');

const state = {
  view: null, colorBy: 'status', sel: null,
  show: { plane: true, detours: true, stitch: true, edges: true, pads: true, labels: false },
  sort: { key: 'status', dir: 1 }, cls: new Set(), status: new Set(), q: ''
};

const netColor = n => {
  const s = NETS[n];
  if (!s) return 'var(--ctx)';
  return state.colorBy === 'cls' ? `var(--c-${s.cls})` : `var(--${s.status === 'OK' ? 'ok' : s.status.toLowerCase()})`;
};
const sevColor = s => `var(--${(s || 'INFO') === 'INFO' ? 'ok' : s.toLowerCase()})`;
const pts = p => p.map(q => q[0] + ',' + q[1]).join(' ');
const pathD = cs => cs.map(c => 'M' + c.map(q => q[0] + ' ' + q[1]).join('L') + 'Z').join('');

// ---------- header
(function header() {
  const m = D.meta, n = D.nets;
  const refs = Object.entries(m.references).sort((a, b) => LAYER_ORDER(a[0]) - LAYER_ORDER(b[0]))
    .map(([s, r]) => `${s}→${r.layer} (h ${r.h} mm)`).join(' · ');
  $('#meta').innerHTML = `${esc(m.board)} · generated ${esc(m.generated.replace('T', ' '))} · ${esc(refs)}`;
  const fail = n.filter(s => s.status === 'FAIL'), warn = n.filter(s => s.status === 'WARN');
  const worst = n.filter(s => s.ratio != null).sort((a, b) => b.ratio - a.ratio)[0];
  const open = n.filter(s => s.return_est == null).length;
  const viaFails = D.issues.filter(i => i.kind === 'VIA' && i.severity === 'FAIL').length;
  const short = s => nice(s.net).split('/').pop();
  $('#tiles').innerHTML = [
    ['Nets checked', n.length, `${new Set(n.map(s => s.cls)).size} classes`],
    ['Failing', `<span style="color:var(--fail)">${fail.length}</span>`, fail.slice(0, 3).map(short).join(', ') || 'none'],
    ['Warnings', `<span style="color:var(--warn)">${warn.length}</span>`, `${open} with no local return path`],
    ['Worst return ratio', worst ? worst.ratio.toFixed(2) + '×' : '–', worst ? nice(worst.net) : ''],
    ['Under-stitched vias', viaFails, `> ${m.thresholds.max_stitch} mm to a return via`],
  ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`).join('');
})();

// ---------- controls
const checkedLayers = [...new Set(D.geo.tracks.filter(t => NETS[t.n]).map(t => t.l))]
  .filter(l => D.meta.references[l]).sort((a, b) => LAYER_ORDER(a) - LAYER_ORDER(b));
state.view = checkedLayers[0] || 'all';

function buildControls() {
  $('#views').innerHTML = [...checkedLayers, 'all'].map(l => {
    const lab = l === 'all' ? 'All layers' : `${l} <span class="muted">on ${D.meta.references[l].layer}</span>`;
    return `<button data-v="${l}" aria-pressed="${state.view === l}">${lab}</button>`;
  }).join('');
  $('#views').onclick = e => { const b = e.target.closest('button'); if (b) { state.view = b.dataset.v; buildControls(); render(); } };
  for (const b of $('#colorby').children) b.setAttribute('aria-pressed', b.dataset.v === state.colorBy);
  $('#colorby').onclick = e => { const b = e.target.closest('button'); if (b) { state.colorBy = b.dataset.v; buildControls(); render(); renderLegend(); } };
  const labels = { plane: 'Plane', detours: 'Void detours', stitch: 'Via returns', edges: 'Plane-edge', pads: 'Pads', labels: 'Refs' };
  $('#toggles').innerHTML = Object.entries(labels).map(([k, v]) =>
    `<label><input type="checkbox" data-k="${k}" ${state.show[k] ? 'checked' : ''}>${v}</label>`).join('');
  $('#toggles').onchange = e => { state.show[e.target.dataset.k] = e.target.checked; render(); };
}

function renderLegend() {
  const items = state.colorBy === 'cls'
    ? CLASSES.filter(c => D.nets.some(n => n.cls === c)).map(c => `<span><i class="sw" style="border-color:var(--c-${c})"></i>${c}</span>`)
    : [['fail', 'FAIL'], ['warn', 'WARN'], ['ok', 'OK']].map(([c, l]) => `<span><i class="sw" style="border-color:var(--${c})"></i>${l} net</span>`);
  items.push(`<span><i class="sw" style="border-color:var(--ctx)"></i>other nets</span>`,
    `<span><i class="sw" style="border-color:var(--fail)"></i>trace over void</span>`,
    `<span><i class="sw dash" style="border-color:var(--detour)"></i>return detour</span>`,
    `<span><i class="sw dash" style="border-color:var(--ok)"></i>via → nearest return via</span>`,
    `<span><i class="sw" style="border-color:var(--edge);opacity:.5;border-top-width:6px"></i>near plane edge</span>`,
    `<span><i class="dot" style="background:var(--plane)"></i>reference plane</span>`);
  $('#legend').innerHTML = items.join('');
}

// ---------- board rendering
function render() {
  const v = state.view, all = v === 'all';
  const ref = all ? null : D.meta.references[v].layer;
  const onView = l => all || l === v;
  const side = all ? null : (v === 'B.Cu' ? 'B' : v === 'F.Cu' ? 'F' : null);
  const g = D.geo, o = D.overlays;
  let s = `<path class="outline" fill-rule="evenodd" d="${pathD(g.outline)}"/>`;

  if (state.show.plane) {
    const planeLayers = all ? [] : [ref];
    s += '<g class="plane">';
    for (const l of planeLayers) for (const z of (g.planes[l] || []))
      s += `<path d="${pathD(z.c)}" style="fill:var(${z.net.toUpperCase().startsWith('GND') ? '--plane' : '--plane-alt'})"/>`;
    s += '</g>';
  }
  if (state.show.pads) {
    s += '<g>' + g.pads.filter(p => all || p[4] === '*' || p[4] === side)
      .map(p => `<rect class="pad" x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" rx="${Math.min(p[2], p[3]) * .2}"/>`).join('') + '</g>';
  }
  if (state.show.edges)
    s += '<g>' + o.edges.filter(e => onView(e.layer)).map(e => `<polyline class="ovl-edge" data-net="${esc(e.net)}" points="${pts(e.p)}"/>`).join('') + '</g>';

  // tracks: context (unchecked nets) on this layer, checked nets on other layers, then checked on this layer
  let ctx = '', other = '', main = '';
  for (const t of g.tracks) {
    const checked = !!NETS[t.n];
    if (!checked) {
      if (onView(t.l)) ctx += `<polyline class="ctx" stroke-width="${t.w}" points="${pts(t.p)}" data-tip="${nice(t.n || 'no net')}"/>`;
    } else if (onView(t.l)) {
      main += `<polyline class="trk" data-net="${esc(t.n)}" stroke-width="${t.w}" style="stroke:${netColor(t.n)};color:${netColor(t.n)}" points="${pts(t.p)}"/>`;
    } else {
      other += `<polyline class="trk other" data-net="${esc(t.n)}" stroke-width="${t.w}" style="stroke:${netColor(t.n)}" points="${pts(t.p)}"/>`;
    }
  }
  s += `<g>${ctx}</g><g>${other}</g><g>${main}</g>`;
  s += '<g>' + g.vias.map(q => `<circle class="via" cx="${q[0]}" cy="${q[1]}" r="${q[2] / 2}"${NETS[q[3]] ? ` data-net="${esc(q[3])}"` : ''}/>`).join('') + '</g>';

  // void overlays
  if (state.show.detours) {
    s += '<g>';
    for (const ov of o.voids.filter(x => onView(x.layer))) {
      const bad = ov.kind === 'TERMINAL' ? 'var(--warn)' : 'var(--fail)';
      const tip = nice(`${ov.net} · ${ov.kind}${ov.kind === 'VOID' ? ` · return +${ov.extra.toFixed(2)} mm` : ''}`);
      for (const tr of ov.trace)
        s += `<polyline class="ovl" data-net="${esc(ov.net)}" data-tip="${tip}" style="stroke:${bad};stroke-width:4px" points="${pts(tr)}"/>`;
      for (const d of ov.detours) {
        s += `<polyline class="ovl" data-net="${esc(ov.net)}" data-tip="${tip}" style="stroke:var(--detour);stroke-width:2.2px;stroke-dasharray:5 3" points="${pts(d)}"/>`;
        const m = d[Math.floor(d.length / 2)];
        if (ov.extra >= 0.2) s += `<text class="lbl" data-net="${esc(ov.net)}" x="${m[0]}" y="${m[1] - .4}" style="fill:var(--detour)">+${ov.extra.toFixed(1)} mm</text>`;
      }
    }
    s += '</g>';
  }
  // via transfer overlays
  if (state.show.stitch) {
    s += '<g>';
    for (const ov of o.vias) {
      const c = sevColor(ov.sev);
      const tip = nice(`${ov.net} · ${ov.layers.join('→')} via · ` + (ov.d == null ? 'no return path'
        : ov.kind === 'cap' ? `return through ${ov.cap}, ${ov.d.toFixed(2)} mm` : `nearest ${ov.via_net} via ${ov.d.toFixed(2)} mm`));
      const dim = ov.sev === 'INFO' ? ';opacity:.55' : '';
      if (ov.to) {
        s += `<line class="ovl" data-net="${esc(ov.net)}" data-tip="${tip}" x1="${ov.pos[0]}" y1="${ov.pos[1]}" x2="${ov.to[0]}" y2="${ov.to[1]}" style="stroke:${c};stroke-width:2px;stroke-dasharray:4 3${dim}"/>`;
        s += `<circle class="ovl" data-net="${esc(ov.net)}" cx="${ov.to[0]}" cy="${ov.to[1]}" r=".38" style="stroke:var(--ok);stroke-width:1.6px${dim}"/>`;
        if (ov.sev !== 'INFO') {
          const mx = (ov.pos[0] + ov.to[0]) / 2, my = (ov.pos[1] + ov.to[1]) / 2;
          s += `<text class="lbl" data-net="${esc(ov.net)}" x="${mx}" y="${my - .35}" style="fill:${c}">${ov.d.toFixed(1)} mm</text>`;
        }
      }
      s += `<circle class="ovl" data-net="${esc(ov.net)}" data-tip="${tip}" cx="${ov.pos[0]}" cy="${ov.pos[1]}" r=".42" style="stroke:${c};stroke-width:2.4px${dim}"/>`;
    }
    s += '</g>';
  }
  if (state.show.labels)
    s += '<g>' + g.refs.filter(r => all || !side || r[3] === side).map(r => `<text class="ref" x="${r[1]}" y="${r[2]}">${esc(r[0])}</text>`).join('') + '</g>';
  s += '<g id="markers"></g>';
  svg.innerHTML = s;
  applySel();
}

function applySel() {
  svg.classList.toggle('has-sel', !!state.sel);
  for (const el of svg.querySelectorAll('[data-net]')) el.classList.toggle('sel', el.dataset.net === state.sel);
  for (const tr of document.querySelectorAll('#table tbody tr')) tr.classList.toggle('sel', tr.dataset.net === state.sel);
}

// ---------- pan / zoom
let vb = null;
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function fit(b, pad = 2) {
  const r = svg.getBoundingClientRect();
  let ar = r.width / r.height;
  if (!isFinite(ar) || ar <= 0) ar = 1.6;
  let w = b[2] + 2 * pad, h = b[3] + 2 * pad;
  if (w / h > ar) h = w / ar; else w = h * ar;
  vb = { x: b[0] + b[2] / 2 - w / 2, y: b[1] + b[3] / 2 - h / 2, w, h };
  setVB();
}
const fitBoard = () => fit(D.geo.bbox, 1.5);
const toUser = e => { const r = svg.getBoundingClientRect(); return { x: vb.x + (e.clientX - r.left) / r.width * vb.w, y: vb.y + (e.clientY - r.top) / r.height * vb.h }; };
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const p = toUser(e), k = Math.exp(e.deltaY * 0.0015);
  vb.x = p.x - (p.x - vb.x) * k; vb.y = p.y - (p.y - vb.y) * k; vb.w *= k; vb.h *= k; setVB();
}, { passive: false });
let drag = null;
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', e => {
  if (drag) {
    const r = svg.getBoundingClientRect(), dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 3) { svg.classList.add('dragging'); vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h; setVB(); }
    drag.x = e.clientX; drag.y = e.clientY;
    return;
  }
  const el = e.target.closest('[data-net],[data-tip]'), tip = $('#tip');
  if (!el) { tip.style.display = 'none'; return; }
  const n = NETS[el.dataset.net];
  tip.innerHTML = el.dataset.tip && !el.classList.contains('trk') ? esc(el.dataset.tip).replace(/ · /, '<br>')
    : n ? `<b>${nice(n.net)}</b><br>${n.cls} · ${n.status} · ratio ${fmt(n.ratio)} · loop ${fmt(n.loop_area, 1)} mm²` : esc(el.dataset.tip || '');
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});
svg.addEventListener('pointerleave', () => { $('#tip').style.display = 'none'; });
svg.addEventListener('pointerup', e => {
  const wasDrag = drag && drag.moved > 3;
  drag = null; svg.classList.remove('dragging');
  if (wasDrag) return;
  const el = e.target.closest('[data-net]');
  select(el ? el.dataset.net : null, false);
});
svg.addEventListener('dblclick', fitBoard);
$('#fit').onclick = fitBoard;
// Fit once the SVG has a real size, then keep the centre and width on resize.
let sized = false;
new ResizeObserver(() => {
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  if (!sized) { sized = true; fitBoard(); return; }
  const cy = vb.y + vb.h / 2; vb.h = vb.w * r.height / r.width; vb.y = cy - vb.h / 2; setVB();
}).observe(svg);

function netBBox(net) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const t of D.geo.tracks) if (t.n === net) for (const [x, y] of t.p) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return x0 === Infinity ? null : [x0, y0, x1 - x0, y1 - y0];
}

function select(net, zoom) {
  state.sel = net;
  if (net && zoom) {
    const onView = D.geo.tracks.some(t => t.n === net && (state.view === 'all' || t.l === state.view));
    if (!onView) { state.view = 'all'; buildControls(); render(); }
    const b = netBBox(net); if (b) fit(b, 3);
  }
  applySel(); renderDetail();
}

function mark(x, y) {
  const r = Math.max(vb.w / 60, 0.6);
  $('#markers').innerHTML = `<circle class="marker" cx="${x}" cy="${y}" r="${r}"/>`;
}

// ---------- detail panel
function renderDetail() {
  const n = NETS[state.sel], el = $('#detail');
  if (!n) {
    const t = D.meta.thresholds;
    el.innerHTML = `<h2>How to read this</h2>
      <p class="muted" style="margin:0 0 10px">Click a trace or a table row to inspect a net. Each view shows one signal layer over the plane that carries its return current.</p>
      <dl class="stats">
        <dt>Return length</dt><dd>trace + void detours + via transfers</dd>
        <dt>Ratio</dt><dd>return ÷ trace (1.00 = ideal)</dd>
        <dt>Loop area</dt><dd>trace×h + detour areas + via loops</dd>
        <dt>Void FAIL</dt><dd class="num">detour &gt; ${t.max_detour} mm</dd>
        <dt>Via FAIL</dt><dd class="num">return via &gt; ${t.max_stitch} mm</dd>
        <dt>Edge warning</dt><dd class="num">plane edge &lt; w/2 + ${t.edge_k}h</dd>
      </dl>
      <p class="muted" style="margin:0;font-size:12.5px">Low-speed nets are capped at WARN and static nets at INFO.</p>`;
    return;
  }
  const iss = D.issues.filter(i => i.net === n.net).sort((a, b) => SEV[a.severity] - SEV[b.severity]);
  el.innerHTML = `<div class="name">${nice(n.net)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
      <span class="badge b-${n.status}">${n.status}</span>
      <span class="badge" style="color:var(--c-${n.cls})">${n.cls}</span>
      ${n.netclass !== 'Default' ? `<span class="badge muted">${esc(n.netclass)}</span>` : ''}
    </div>
    <dl class="stats num">
      <dt>Track length</dt><dd>${fmt(n.length)} mm</dd>
      <dt>Return path</dt><dd>${n.return_est == null ? 'no local return' : fmt(n.return_est) + ' mm'}</dd>
      <dt>Ratio</dt><dd>${n.ratio == null ? '–' : fmt(n.ratio) + '×'}</dd>
      <dt>Loop area</dt><dd>${fmt(n.loop_area, 1)} mm²</dd>
      <dt class="muted">&nbsp; under trace</dt><dd class="muted">${fmt(n.area_ref, 1)}</dd>
      <dt class="muted">&nbsp; void detours</dt><dd class="muted">${fmt(n.area_void, 1)}</dd>
      <dt class="muted">&nbsp; via transfers</dt><dd class="muted">${fmt(n.area_via, 1)}</dd>
      <dt>Void detours</dt><dd>+${fmt(n.void_extra)} mm (${n.voids})</dd>
      <dt>Via transfers</dt><dd>+${fmt(n.via_extra)} mm (${n.transitions})</dd>
      <dt>Unreferenced</dt><dd>${fmt(n.unref)} mm</dd>
      <dt>Near plane edge</dt><dd>${fmt(n.edge)} mm</dd>
    </dl>
    <h2 style="margin-top:4px">Issues <span class="muted">(${iss.length})</span></h2>
    <ul class="issues">${iss.map((i, k) => `<li class="${i.x != null ? 'go' : ''}" data-k="${k}">
        <span class="badge b-${i.severity}">${i.severity}</span><span class="kind">${i.kind}</span><span class="muted">${esc(i.layer)}</span><br>${esc(i.msg)}${i.raw !== i.severity ? ` <span class="muted">(${i.raw} before class cap)</span>` : ''}</li>`).join('') || '<li class="muted">No issues</li>'}</ul>
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="zoomnet">Zoom to net</button><button class="btn" id="clearsel">Clear</button></div>`;
  el.querySelector('.issues').onclick = e => {
    const li = e.target.closest('li.go'); if (!li) return;
    const i = iss[+li.dataset.k];
    fit([i.x - 3, i.y - 3, 6, 6], 0); mark(i.x, i.y);
  };
  $('#zoomnet').onclick = () => select(n.net, true);
  $('#clearsel').onclick = () => select(null, false);
}

// ---------- table
const COLS = [
  ['status', 'Status'], ['net', 'Net'], ['cls', 'Class'],
  ['length', 'Track (mm)', 1], ['return_est', 'Return (mm)', 1], ['ratio', 'Return : track', 1],
  ['loop_area', 'Loop area (mm²)', 1], ['voids', 'Voids', 1], ['transitions', 'Layer changes', 1], ['worst_stitch', 'Worst via return (mm)', 1],
];
const maxRatio = Math.max(1.2, ...D.nets.map(n => n.ratio || 1));

function sortVal(n, k) {
  if (k === 'status') return SEV[n.status];
  if (k === 'cls') return CLASSES.indexOf(n.cls);
  if (k === 'ratio' && n.ratio == null) return Infinity;
  if (k === 'return_est' && n.return_est == null) return Infinity;
  return n[k];
}

function buildFilters() {
  const cnt = (k, v) => D.nets.filter(n => n[k] === v).length;
  const cls = CLASSES.filter(c => cnt('cls', c)).map(c =>
    `<button class="chip" data-f="cls" data-v="${c}" aria-pressed="${state.cls.has(c)}"><i class="dot" style="background:var(--c-${c})"></i>${c}<span class="c">${cnt('cls', c)}</span></button>`);
  const st = ['FAIL', 'WARN', 'OK'].filter(s => cnt('status', s)).map(s =>
    `<button class="chip" data-f="status" data-v="${s}" aria-pressed="${state.status.has(s)}"><span class="b-${s}" style="font-weight:650">${s}</span><span class="c">${cnt('status', s)}</span></button>`);
  $('#filters').innerHTML = st.join('') + '<span style="width:8px"></span>' + cls.join('') +
    `<input type="search" id="q" placeholder="Filter nets" value="${esc(state.q)}" style="margin-left:auto">`;
  $('#filters').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const set = state[b.dataset.f]; set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v);
    buildFilters(); renderTable();
  };
  $('#q').oninput = e => { state.q = e.target.value; renderTable(); };
}

function renderTable() {
  const { key, dir } = state.sort;
  $('#table thead').innerHTML = '<tr>' + COLS.map(([k, l, r]) =>
    `<th data-k="${k}" class="${r ? 'r' : ''}" ${k === key ? `aria-sort="${dir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}${k === key ? (dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('') + '</tr>';
  const q = state.q.toLowerCase();
  const rows = D.nets.filter(n => (!state.cls.size || state.cls.has(n.cls)) && (!state.status.size || state.status.has(n.status))
    && (!q || n.net.toLowerCase().includes(q)))
    .sort((a, b) => {
      const va = sortVal(a, key), vb2 = sortVal(b, key);
      if (va < vb2) return -dir; if (va > vb2) return dir;
      return SEV[a.status] - SEV[b.status] || (b.ratio || 9) - (a.ratio || 9);
    });
  $('#table tbody').innerHTML = rows.map(n => {
    const w = n.ratio == null ? 100 : Math.max(2, (n.ratio - 1) / (maxRatio - 1) * 100);
    const barC = n.ratio == null ? 'var(--fail)' : `var(--${n.status === 'OK' ? 'ok' : n.status.toLowerCase()})`;
    return `<tr data-net="${esc(n.net)}">
      <td><span class="badge b-${n.status}">${n.status}</span></td>
      <td>${nice(n.net)}${n.netclass !== 'Default' ? ` <span class="muted">${esc(n.netclass)}</span>` : ''}</td>
      <td><span class="cls"><i class="dot" style="background:var(--c-${n.cls})"></i>${n.cls}</span></td>
      <td class="r num">${fmt(n.length)}</td>
      <td class="r num">${n.return_est == null ? '<span style="color:var(--fail)">open</span>' : fmt(n.return_est)}</td>
      <td class="r num"><span class="ratio">${n.ratio == null ? '–' : fmt(n.ratio) + '×'}<span class="bar"><i style="width:${w}%;background:${barC}"></i></span></span></td>
      <td class="r num">${fmt(n.loop_area, 1)}</td>
      <td class="r num">${n.voids || '–'}</td>
      <td class="r num">${n.transitions || '–'}</td>
      <td class="r num">${n.worst_stitch == null ? '–' : fmt(n.worst_stitch)}</td></tr>`;
  }).join('');
  $('#foot').textContent = `${rows.length} of ${D.nets.length} nets · ratio bar spans 1.00× to ${maxRatio.toFixed(2)}× · loop area is an estimate: trace length × dielectric height, plus the plan-view area between each void crossing and its detour, plus via-to-return-via distance × plane spacing.`;
  applySel();
}
$('#table thead').onclick = e => {
  const th = e.target.closest('th'); if (!th) return;
  const k = th.dataset.k;
  state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (['net', 'cls', 'status'].includes(k) ? 1 : -1) };
  renderTable();
};
$('#table tbody').onclick = e => { const tr = e.target.closest('tr'); if (tr) { select(tr.dataset.net, true); svg.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };

buildControls(); renderLegend(); render(); fitBoard(); renderDetail(); buildFilters(); renderTable();
</script>
</body>
</html>
