<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return Path Report</title>
<!-- Template for return_path_check.py --html; the script replaces the DATA placeholder. -->
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1c1d1f; --muted: #686b73;
  --border: #e1e1dc; --accent: #3e63dd;
  --canvas: #e8ebe5; --substrate: #dde3d9; --outline: #97a396; --plane: #bfcdbb; --plane-alt: #cbc3df;
  --ctx: #8b908b; --pad: #b9a77a; --via: #7d837d;
  --fail: #d13b40; --warn: #b87d00; --ok: #2b8f5a; --info: #3e63dd; --detour: #e8590c; --edge: #e0a100;
  --c-rf: #c2298a; --c-clock: #e8590c; --c-high-speed: #c99400; --c-analog: #0f9488;
  --c-medium: #3e63dd; --c-low-speed: #8e4ec6; --c-static: #7c7f88; --c-unclassified: #a5a8ae;
  /* One colour pair per reference plane, in stack order: --rp-N for the plane and the return-current
     glow it carries, --sig-N for the signal traces returning through it. Each pair is complementary,
     signal warm and return cool, so the two stay distinct where they overlap. */
  --rp-0: #1c7ed6; --rp-1: #6741d9; --rp-2: #1098ad; --rp-3: #d6336c;
  --sig-0: #e8590c; --sig-1: #7a9a01; --sig-2: #e03131; --sig-3: #2f9e44;
  --hot: #0e1a24;  /* the return glow's core is mixed toward this: darker on light, lighter on dark */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111213; --surface: #18191b; --surface-2: #212225; --text: #ececee; --muted: #9b9ea6;
    --border: #2d2e32; --accent: #8098ff;
    --canvas: #0b0e0c; --substrate: #121915; --outline: #3f5044; --plane: #1b3325; --plane-alt: #2c2442;
    --ctx: #5b615c; --pad: #6b5d3d; --via: #6a716b;
    --fail: #ff5c61; --warn: #f5b323; --ok: #3dd68c; --info: #8098ff; --detour: #ff8b3e; --edge: #f5c323;
    --c-rf: #f06bc0; --c-clock: #ff8b3e; --c-high-speed: #f5c323; --c-analog: #2ec4b6;
    --c-medium: #8098ff; --c-low-speed: #b98ef0; --c-static: #9b9ea6; --c-unclassified: #6f7278;
    --rp-0: #4dabf7; --rp-1: #9775fa; --rp-2: #3bc9db; --rp-3: #f783ac; --hot: #ffffff;
    --sig-0: #ff9f43; --sig-1: #d3f36b; --sig-2: #ff8787; --sig-3: #69db7c;
  }
}
:root[data-theme="dark"] {
  --bg: #111213; --surface: #18191b; --surface-2: #212225; --text: #ececee; --muted: #9b9ea6;
  --border: #2d2e32; --accent: #8098ff;
  --canvas: #0b0e0c; --substrate: #121915; --outline: #3f5044; --plane: #1b3325; --plane-alt: #2c2442;
  --ctx: #5b615c; --pad: #6b5d3d; --via: #6a716b;
  --fail: #ff5c61; --warn: #f5b323; --ok: #3dd68c; --info: #8098ff; --detour: #ff8b3e; --edge: #f5c323;
  --c-rf: #f06bc0; --c-clock: #ff8b3e; --c-high-speed: #f5c323; --c-analog: #2ec4b6;
  --c-medium: #8098ff; --c-low-speed: #b98ef0; --c-static: #9b9ea6; --c-unclassified: #6f7278;
  --rp-0: #4dabf7; --rp-1: #9775fa; --rp-2: #3bc9db; --rp-3: #f783ac; --hot: #ffffff;
  --sig-0: #ff9f43; --sig-1: #d3f36b; --sig-2: #ff8787; --sig-3: #69db7c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 2px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
.meta { color: var(--muted); font-size: 12.5px; }
/* live mode (--serve): rerun button and board-saved status, top right */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 16px; flex-wrap: wrap; }
.live { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.live[hidden] { display: none; }
.live.stale #live-status { color: var(--warn); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn:disabled { opacity: .6; cursor: default; }
.num { font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; }
.tile .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.viewer { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
@media (max-width: 960px) { .viewer { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font: inherit;
  font-size: 12.5px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.toggles label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px;
  padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.board-wrap { position: relative; border-radius: 10px; overflow: hidden; background: var(--canvas);
  border: 1px solid var(--border); }
#board { display: block; width: 100%; height: min(62vh, 640px); min-height: 280px; cursor: grab; touch-action: none; }
#board.dragging { cursor: grabbing; }
.hint { position: absolute; left: 8px; bottom: 6px; font-size: 11.5px; color: var(--muted); pointer-events: none;
  background: color-mix(in srgb, var(--canvas) 85%, transparent); padding: 2px 7px; border-radius: 6px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px #0003;
  display: none; z-index: 10; max-width: 320px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .note { flex-basis: 100%; display: block; }
.sw { width: 18px; height: 0; border-top: 3px solid; display: inline-block; flex: none; }
.sw.dash { border-top-style: dashed; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
/* legend swatch for the predicted return current: a soft glow, brightest along the middle */
.heat { width: 26px; height: 12px; border-radius: 6px; display: inline-block; flex: none;
  background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--c) 20%, transparent) 22%,
    color-mix(in srgb, var(--c) 65%, transparent) 42%, color-mix(in srgb, var(--c) 62%, var(--hot)) 50%,
    color-mix(in srgb, var(--c) 65%, transparent) 58%, color-mix(in srgb, var(--c) 20%, transparent) 78%, transparent 100%); }
.heat.sm { width: 18px; height: 10px; }
.ring { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--text); background: var(--canvas);
  display: inline-block; flex: none; }
.gapsw { width: 22px; height: 10px; border: 2px solid var(--fail); border-radius: 2px; display: inline-block; flex: none;
  background: var(--canvas); position: relative; }
.gapsw::after { content: ''; position: absolute; left: 1px; right: 1px; top: 50%; margin-top: -1px; border-top: 2px solid var(--muted); }
.xm { color: var(--fail); font-weight: 700; }
.badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 99px;
  border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
.b-FAIL { color: var(--fail); } .b-WARN { color: var(--warn); } .b-OK { color: var(--ok); } .b-INFO { color: var(--info); }
.cls { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#detail .name { font-weight: 650; font-size: 15px; word-break: break-all; }
.explain { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.stats { display: grid; grid-template-columns: auto auto; gap: 3px 12px; font-size: 13px; margin: 10px 0; }
.stats dt { color: var(--muted); } .stats dd { margin: 0; text-align: right; }
.stats dt.sub { padding-left: 10px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.stats dt.sub .sw { width: 14px; }
.stats dd.sub { color: var(--muted); font-size: 12.5px; }
.issues { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px;
  max-height: 340px; overflow: auto; }
.issues li { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.issues li.go { cursor: pointer; }
.issues li.go:hover { outline: 1px solid var(--accent); }
.issues .kind { font-weight: 650; margin: 0 4px; }
.muted { color: var(--muted); }
.table-card { margin-top: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 99px;
  padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--text); }
.chip .c { color: var(--muted); }
input[type=search] { border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12.5px; min-width: 180px; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0;
  background: var(--surface); }
th.r, td.r { text-align: right; }
th[aria-sort] { color: var(--text); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.ratio { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.bar { width: 70px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.foot { margin-top: 14px; font-size: 12px; color: var(--muted); }
/* board */
#board .outline { fill: var(--substrate); stroke: var(--outline); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#board .plane path { stroke: none; fill-rule: evenodd; }
#board .plane-edge path { fill: none; stroke-width: 1px; vector-effect: non-scaling-stroke; opacity: .6; }
#board .pad { fill: var(--pad); opacity: .55; }
#board .ctx { stroke: var(--ctx); opacity: .45; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#board .trk { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#board .trk.other { opacity: .22; }
#board .via { fill: var(--via); }
#board .ovl { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#board .ovl.dim { opacity: .55; }
#board .ovl-edge { stroke: var(--edge); stroke-width: 7px; opacity: .35; fill: none;
  vector-effect: non-scaling-stroke; stroke-linecap: round; }
#board text { font-family: system-ui, sans-serif; paint-order: stroke; stroke: var(--canvas); stroke-width: 2.5px;
  vector-effect: non-scaling-stroke; pointer-events: none; }
/* label sizes are set from the zoom level in setVB(), so text stays the same size on screen */
#board .ref { fill: var(--muted); font-size: var(--fs-ref, .8px); text-anchor: middle; dominant-baseline: middle; }
#board .lbl { font-weight: 700; font-size: var(--fs-lbl, .9px); text-anchor: middle; }
#board.has-sel [data-net]:not(.sel) { opacity: .1; }
#board.has-sel .trk.sel { filter: drop-shadow(0 0 .25px currentColor); }
/* selected net: signal path + predicted return path (drawn in #sel, replacing the net's own overlays) */
#board.retmode .trk.sel, #board.retmode .ovl.sel, #board.retmode .lbl.sel { display: none; }
#board .rheat { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#board .rline { fill: none; stroke-width: 1.2px; vector-effect: non-scaling-stroke; stroke-dasharray: 4 4; opacity: .85; }
#board .rcap { stroke: var(--muted); stroke-width: 1.4px; vector-effect: non-scaling-stroke; stroke-dasharray: 2 3; }
/* trace over a plane gap: a crisp red sleeve around the signal (not a haze, so it can't read as a
   glow). Each ring is drawn twice, in pixels and in board units, so it stays visible at any zoom. */
#board .gap, #board .gap-u { fill: none; stroke: var(--fail); stroke-linecap: butt; stroke-linejoin: round; }
#board .gap { stroke-width: 9px; vector-effect: non-scaling-stroke; }
#board .gap-in, #board .gap-in-u { fill: none; stroke: var(--canvas); stroke-linecap: butt; stroke-linejoin: round; }
#board .gap-in { stroke-width: 5px; vector-effect: non-scaling-stroke; }
/* the amber plane-edge haze would look like a glow in the signal's colour; the side panel still lists it */
#board.retmode .ovl-edge.sel { display: none; }
#board .sig-case { fill: none; stroke: var(--canvas); stroke-width: 5px; vector-effect: non-scaling-stroke;
  stroke-linecap: round; stroke-linejoin: round; }
#board .sig { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#board .sig-min { fill: none; stroke-width: 2.2px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#board .svia { fill: var(--canvas); stroke: var(--text); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
#board .rvia { fill: var(--canvas); stroke: var(--text); stroke-width: 2px; vector-effect: non-scaling-stroke; }
#board .rvia-dot { fill: var(--text); pointer-events: none; }
#board .xmark { fill: none; stroke: var(--fail); stroke-width: 2.6px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
#board .marker { fill: none; stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke;
  animation: pulse 1.2s ease-out 3; }
@keyframes pulse { from { opacity: 1; } to { opacity: .2; } }
</style>
</head>
<body>
<main>
  <header class="head">
    <div>
      <h1>Return path report</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="live" id="live" hidden>
      <span id="live-status" role="status"></span>
      <button class="btn" id="rerun">Rerun</button>
    </div>
  </header>
  <section class="tiles" id="tiles"></section>

  <section class="viewer">
    <div class="card">
      <div class="toolbar">
        <div class="seg" id="views" role="group" aria-label="Layer view"></div>
        <div class="seg" id="colorby" role="group" aria-label="Colour by">
          <button data-v="status">Status</button><button data-v="cls">Class</button>
        </div>
        <div class="toggles" id="toggles"></div>
        <button class="btn" id="fit">Fit board</button>
      </div>
      <div class="board-wrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="hint">Scroll to zoom · drag to pan · click a trace or table row to see its return path · viewed from top</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="card" id="detail"></aside>
  </section>

  <section class="card table-card">
    <h2>Per-net summary</h2>
    <div class="filters" id="filters"></div>
    <div class="tscroll"><table id="table"><thead></thead><tbody></tbody></table></div>
    <div class="foot" id="foot"></div>
  </section>
</main>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice = s => esc(String(s).replace(/\{slash\}/g, '/'));
const fmt = (v, d = 2) => v == null ? '–' : Number(v).toFixed(d);
const NETS = Object.fromEntries(D.nets.map(n => [n.net, n]));
const CLASSES = D.meta.classes;
const SEV = { FAIL: 0, WARN: 1, INFO: 2, OK: 3 };
const LAYER_ORDER = l => l === 'F.Cu' ? 0 : l === 'B.Cu' ? 99 : parseInt((l.match(/\d+/) || [50])[0], 10);
const svg = $('#board');

const state = {
  view: null, colorBy: 'status', sel: null,
  show: { returns: true, plane: true, detours: true, stitch: true, edges: true, pads: true, labels: false },
  sort: { key: 'status', dir: 1 }, cls: new Set(), status: new Set(), q: ''
};

const netColor = n => {
  const s = NETS[n];
  if (!s) return 'var(--ctx)';
  return state.colorBy === 'cls' ? `var(--c-${s.cls})` : `var(--${s.status === 'OK' ? 'ok' : s.status.toLowerCase()})`;
};
const sevColor = s => `var(--${(s || 'INFO') === 'INFO' ? 'ok' : s.toLowerCase()})`;
const pts = p => p.map(q => q[0] + ',' + q[1]).join(' ');
const pathD = cs => cs.map(c => 'M' + c.map(q => q[0] + ' ' + q[1]).join('L') + 'Z').join('');

// Each reference plane gets a colour pair, in stack order: a cool one for the plane and the return
// glow it carries, and its warm complement for the signal traces returning through it. So a trace and
// its return are always distinct, and a change of glow colour shows the return changing plane.
const PLANES = D.meta.planes || [];
const planeIdx = p => Math.max(0, PLANES.indexOf(p)) % 4;
const planeVar = p => `var(--rp-${planeIdx(p)})`;
const refOf = l => (D.meta.references[l] || {}).layer;
const sigColor = l => refOf(l) ? `var(--sig-${planeIdx(refOf(l))})` : 'var(--text)';
const netLayers = net => [...new Set(D.geo.tracks.filter(t => t.n === net).map(t => t.l))];

// ---------- header
(function header() {
  const m = D.meta, n = D.nets;
  const refs = Object.entries(m.references).sort((a, b) => LAYER_ORDER(a[0]) - LAYER_ORDER(b[0]))
    .map(([s, r]) => `${s}→${r.layer} (h ${r.h} mm)`).join(' · ');
  const saved = m.board_mtime ? ` from the board saved ${esc(m.board_mtime.slice(11))}` : '';
  $('#meta').innerHTML = `${esc(m.board)} · generated ${esc(m.generated.replace('T', ' '))}${saved} · ${esc(refs)}`;
  const fail = n.filter(s => s.status === 'FAIL'), warn = n.filter(s => s.status === 'WARN');
  const worst = n.filter(s => s.ratio != null).sort((a, b) => b.ratio - a.ratio)[0];
  const open = n.filter(s => s.return_est == null).length;
  const viaFails = D.issues.filter(i => i.kind === 'VIA' && i.severity === 'FAIL').length;
  const short = s => nice(s.net).split('/').pop();
  $('#tiles').innerHTML = [
    ['Nets checked', n.length, `${new Set(n.map(s => s.cls)).size} classes`],
    ['Failing', `<span style="color:var(--fail)">${fail.length}</span>`, fail.slice(0, 3).map(short).join(', ') || 'none'],
    ['Warnings', `<span style="color:var(--warn)">${warn.length}</span>`, `${open} with no local return path`],
    ['Worst return ratio', worst ? worst.ratio.toFixed(2) + '×' : '–', worst ? nice(worst.net) : ''],
    ['Under-stitched vias', viaFails, `> ${m.thresholds.max_stitch} mm to a return via`],
  ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`).join('');
})();

// ---------- controls
const checkedLayers = [...new Set(D.geo.tracks.filter(t => NETS[t.n]).map(t => t.l))]
  .filter(l => D.meta.references[l]).sort((a, b) => LAYER_ORDER(a) - LAYER_ORDER(b));
state.view = checkedLayers[0] || 'all';

function buildControls() {
  $('#views').innerHTML = [...checkedLayers, 'all'].map(l => {
    const lab = l === 'all' ? 'All layers' : `${l} <span class="muted">on ${D.meta.references[l].layer}</span>`;
    return `<button data-v="${l}" aria-pressed="${state.view === l}">${lab}</button>`;
  }).join('');
  $('#views').onclick = e => { const b = e.target.closest('button'); if (b) { state.view = b.dataset.v; buildControls(); render(); } };
  for (const b of $('#colorby').children) b.setAttribute('aria-pressed', b.dataset.v === state.colorBy);
  $('#colorby').onclick = e => { const b = e.target.closest('button'); if (b) { state.colorBy = b.dataset.v; buildControls(); render(); } };
  const labels = { returns: 'Return path', plane: 'Plane', detours: 'Void detours', stitch: 'Via returns', edges: 'Plane-edge', pads: 'Pads', labels: 'Refs' };
  $('#toggles').innerHTML = Object.entries(labels).map(([k, v]) =>
    `<label><input type="checkbox" data-k="${k}" ${state.show[k] ? 'checked' : ''}>${v}</label>`).join('');
  $('#toggles').onchange = e => { state.show[e.target.dataset.k] = e.target.checked; render(); renderDetail(); };
}

function renderLegend() {
  const net = state.sel;
  if (net && state.show.returns) {
    const layers = netLayers(net).sort((a, b) => LAYER_ORDER(a) - LAYER_ORDER(b));
    const O = D.overlays, mine = x => x.net === net;
    const planes = [...new Set(O.returns.filter(mine).map(r => r.plane))].sort((a, b) => planeIdx(a) - planeIdx(b));
    const hasVia = O.vias.some(v => mine(v) && v.to), hasGap = O.voids.some(v => mine(v) && !v.minor);
    const hasNone = O.voids.some(v => mine(v) && v.kind !== 'VOID') || O.vias.some(v => mine(v) && !v.to);
    $('#legend').innerHTML = [
      ...layers.map(l => `<span><i class="sw" style="border-color:${sigColor(l)};border-top-width:4px"></i>signal on ${esc(l)}</span>`),
      ...planes.map(p => `<span><i class="heat" style="--c:${planeVar(p)}"></i>predicted return current in ${esc(p)}</span>`),
      hasVia ? `<span><i class="ring"></i>return via</span>` : '',
      hasGap ? `<span><i class="gapsw"></i>trace over a plane gap</span>` : '',
      hasNone ? `<span><b class="xm">✕</b>no return path</span>` : '',
      `<span class="note">The glow is a model of the return current, not copper: brightest in the plane directly under the trace and fading with distance (about 80% of it flows within ±${D.meta.return_band_k}h), around gaps, and through the nearest return via at each layer change. Dashed lines mark where it leaves the trace.</span>`,
    ].join('');
    return;
  }
  const items = state.colorBy === 'cls'
    ? CLASSES.filter(c => D.nets.some(n => n.cls === c)).map(c => `<span><i class="sw" style="border-color:var(--c-${c})"></i>${c}</span>`)
    : [['fail', 'FAIL'], ['warn', 'WARN'], ['ok', 'OK']].map(([c, l]) => `<span><i class="sw" style="border-color:var(--${c})"></i>${l} net</span>`);
  items.push(`<span><i class="sw" style="border-color:var(--ctx)"></i>other nets</span>`,
    `<span><i class="sw" style="border-color:var(--fail)"></i>trace over void</span>`,
    `<span><i class="sw dash" style="border-color:var(--detour)"></i>return detour</span>`,
    `<span><i class="sw dash" style="border-color:var(--ok)"></i>via → nearest return via</span>`,
    `<span><i class="sw" style="border-color:var(--edge);opacity:.5;border-top-width:6px"></i>near plane edge</span>`);
  if (state.view === 'all') items.push(...PLANES.map(p => `<span><i class="sw" style="border-color:${planeVar(p)};border-top-width:1px"></i>${esc(p)} edges</span>`));
  else items.push(`<span><i class="dot" style="background:var(--plane)"></i>reference plane</span>`);
  $('#legend').innerHTML = items.join('');
}

// ---------- board rendering
function render() {
  const v = state.view, all = v === 'all';
  const ref = all ? null : D.meta.references[v].layer;
  const onView = l => all || l === v;
  const side = all ? null : (v === 'B.Cu' ? 'B' : v === 'F.Cu' ? 'F' : null);
  const g = D.geo, o = D.overlays;
  let s = `<path class="outline" fill-rule="evenodd" d="${pathD(g.outline)}"/>`;

  if (state.show.plane) {
    if (all) {
      // both planes at once: draw their edges (outline and every void) in the plane's colour
      for (const l of PLANES) if (g.planes[l])
        s += `<g class="plane-edge" style="stroke:${planeVar(l)}">${g.planes[l].map(z => `<path d="${pathD(z.c)}"/>`).join('')}</g>`;
    } else {
      s += '<g class="plane">';
      for (const z of (g.planes[ref] || []))
        s += `<path d="${pathD(z.c)}" style="fill:var(${z.net.toUpperCase().startsWith('GND') ? '--plane' : '--plane-alt'})"/>`;
      s += '</g>';
    }
  }
  if (state.show.pads) {
    s += '<g>' + g.pads.filter(p => all || p[4] === '*' || p[4] === side)
      .map(p => `<rect class="pad" x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" rx="${Math.min(p[2], p[3]) * .2}"/>`).join('') + '</g>';
  }
  if (state.show.edges)
    s += '<g>' + o.edges.filter(e => onView(e.layer)).map(e => `<polyline class="ovl-edge" data-net="${esc(e.net)}" points="${pts(e.p)}"/>`).join('') + '</g>';

  // tracks: context (unchecked nets) on this layer, checked nets on other layers, then checked on this layer
  let ctx = '', other = '', main = '';
  for (const t of g.tracks) {
    const checked = !!NETS[t.n];
    if (!checked) {
      if (onView(t.l)) ctx += `<polyline class="ctx" stroke-width="${t.w}" points="${pts(t.p)}" data-tip="${nice(t.n || 'no net')}"/>`;
    } else if (onView(t.l)) {
      main += `<polyline class="trk" data-net="${esc(t.n)}" stroke-width="${t.w}" style="stroke:${netColor(t.n)};color:${netColor(t.n)}" points="${pts(t.p)}"/>`;
    } else {
      other += `<polyline class="trk other" data-net="${esc(t.n)}" stroke-width="${t.w}" style="stroke:${netColor(t.n)}" points="${pts(t.p)}"/>`;
    }
  }
  s += `<g>${ctx}</g><g>${other}</g><g>${main}</g>`;
  s += '<g>' + g.vias.map(q => `<circle class="via" cx="${q[0]}" cy="${q[1]}" r="${q[2] / 2}"${NETS[q[3]] ? ` data-net="${esc(q[3])}"` : ''}/>`).join('') + '</g>';

  // void overlays
  if (state.show.detours) {
    s += '<g>';
    for (const ov of o.voids.filter(x => onView(x.layer) && !x.minor)) {
      const bad = ov.kind === 'TERMINAL' ? 'var(--warn)' : 'var(--fail)';
      const tip = nice(`${ov.net} · ${ov.kind}${ov.kind === 'VOID' ? ` · return +${ov.extra.toFixed(2)} mm` : ''}`);
      for (const tr of ov.trace)
        s += `<polyline class="ovl" data-net="${esc(ov.net)}" data-tip="${tip}" style="stroke:${bad};stroke-width:4px" points="${pts(tr)}"/>`;
      for (const d of ov.detours) {
        s += `<polyline class="ovl" data-net="${esc(ov.net)}" data-tip="${tip}" style="stroke:var(--detour);stroke-width:2.2px;stroke-dasharray:5 3" points="${pts(d)}"/>`;
        const m = d[Math.floor(d.length / 2)];
        if (ov.extra >= 0.2) s += `<text class="lbl" data-net="${esc(ov.net)}" x="${m[0]}" y="${m[1]}" dy="-.6em" style="fill:var(--detour)">+${ov.extra.toFixed(1)} mm</text>`;
      }
    }
    s += '</g>';
  }
  // via transfer overlays
  if (state.show.stitch) {
    s += '<g>';
    for (const ov of o.vias) {
      const c = sevColor(ov.sev);
      const tip = nice(`${ov.net} · ${ov.layers.join('→')} via · ` + (ov.d == null ? 'no return path'
        : ov.kind === 'cap' ? `return through ${ov.cap}, ${ov.d.toFixed(2)} mm` : `nearest ${ov.via_net} via ${ov.d.toFixed(2)} mm`));
      // a class, not an inline opacity, so the selection dimming rule still wins
      const cls = ov.sev === 'INFO' ? 'ovl dim' : 'ovl';
      if (ov.to) {
        s += `<line class="${cls}" data-net="${esc(ov.net)}" data-tip="${tip}" x1="${ov.pos[0]}" y1="${ov.pos[1]}" x2="${ov.to[0]}" y2="${ov.to[1]}" style="stroke:${c};stroke-width:2px;stroke-dasharray:4 3"/>`;
        s += `<circle class="${cls}" data-net="${esc(ov.net)}" cx="${ov.to[0]}" cy="${ov.to[1]}" r=".38" style="stroke:var(--ok);stroke-width:1.6px"/>`;
        if (ov.sev !== 'INFO') {
          const mx = (ov.pos[0] + ov.to[0]) / 2, my = (ov.pos[1] + ov.to[1]) / 2;
          s += `<text class="lbl" data-net="${esc(ov.net)}" x="${mx}" y="${my}" dy="-.6em" style="fill:${c}">${ov.d.toFixed(1)} mm</text>`;
        }
      }
      s += `<circle class="${cls}" data-net="${esc(ov.net)}" data-tip="${tip}" cx="${ov.pos[0]}" cy="${ov.pos[1]}" r=".42" style="stroke:${c};stroke-width:2.4px"/>`;
    }
    s += '</g>';
  }
  if (state.show.labels)
    s += '<g>' + g.refs.filter(r => all || !side || r[3] === side).map(r => `<text class="ref" x="${r[1]}" y="${r[2]}">${esc(r[0])}</text>`).join('') + '</g>';
  s += '<g id="sel"></g><g id="markers"></g>';
  svg.innerHTML = s;
  applySel();
}

// Signal path and predicted return path of the selected net. The return is drawn as a soft glow in
// the colour of the plane carrying it, brightest in the plane directly under the trace and fading
// with distance the way the current density does (roughly 1/(1 + (x/h)^2)), so it can't be mistaken
// for copper. It follows the trace, detours around plane gaps, and at each layer change runs out to
// the return via on one plane and back on the other (the two legs side by side). Where the return
// leaves the trace, a dashed line marks its path.
const HEAT = [[1, .16], [.66, .2], [.4, .32], [.2, .55]];  // [share of band half-width, opacity], outside in
function renderSelection() {
  const g = svg.querySelector('#sel');
  const net = state.sel, on = !!net && state.show.returns;
  svg.classList.toggle('retmode', on);
  if (!g) return;
  if (!on) { g.innerHTML = ''; return; }
  const O = D.overlays, TH = D.meta.thresholds;
  const bands = {}, lines = [], halos = [], marks = [], labels = [];
  const band = (plane, p, hw) => (bands[plane] = bands[plane] || []).push({ p, hw });
  const cline = (plane, p, tip) => lines.push(`<polyline class="rline" style="stroke:${planeVar(plane)}" points="${pts(p)}" data-tip="${esc(tip)}"/>`);
  const label = (x, y, text, color) => labels.push(`<text class="lbl" x="${x}" y="${y}" dy="-.6em" style="fill:${color}">${esc(text)}</text>`);
  const cross = (x, y, tip) => marks.push(`<path class="xmark" d="M${x - .4} ${y - .4}L${x + .4} ${y + .4}M${x - .4} ${y + .4}L${x + .4} ${y - .4}" data-tip="${esc(tip)}"/>`);

  // 1. in the reference plane, directly under the trace (the signal drawn on top marks its path)
  for (const r of O.returns) if (r.net === net) band(r.plane, r.p, r.hw);
  // 2. around gaps in the plane
  for (const v of O.voids) if (v.net === net) {
    if (!v.minor) for (const tr of v.trace) {
      const p = pts(tr), w = v.w || 0.25, tip = esc(`Trace over a gap in ${v.ref}`);
      halos.push(`<polyline class="gap" points="${p}" data-tip="${tip}"/>`
        + `<polyline class="gap-u" points="${p}" stroke-width="${(w + 0.14).toFixed(3)}" data-tip="${tip}"/>`
        + `<polyline class="gap-in" points="${p}"/><polyline class="gap-in-u" points="${p}" stroke-width="${(w + 0.05).toFixed(3)}"/>`);
    }
    for (const d of v.detours) {
      band(v.ref, d, v.hw);
      cline(v.ref, d, `Predicted return current · around a gap in ${v.ref}` + (v.extra >= 0.05 ? `, +${v.extra.toFixed(2)} mm` : ''));
      if (!v.minor) {
        const m = d[Math.floor(d.length / 2)];
        label(m[0], m[1], `+${v.extra.toFixed(1)} mm`, v.extra > TH.max_detour ? 'var(--fail)' : 'var(--warn)');
      }
    }
    if (v.kind !== 'VOID') cross(v.mid[0], v.mid[1], {
      ISLAND: `No return path · ${v.ref} copper isn't connected across this gap`,
      SPLIT: 'Plane changes net under the trace · the return has to cross through a capacitor',
      TERMINAL: 'No plane under this trace end · return path undefined here',
    }[v.kind] || v.kind);
  }
  // 3. layer changes: out along one plane to the return via, back along the other
  for (const v of O.vias) if (v.net === net) {
    const P = v.pos, [pa, pb] = v.planes || [];
    if (!v.to) { cross(P[0], P[1], 'No return path · no return via or capacitor found for this layer change'); continue; }
    const via = v.kind === 'cap' ? `capacitor ${v.cap}` : `${v.via_net} via`;
    const legs = v.kind === 'cap' ? [[pa, P, v.pads[0]], [pb, v.pads[1], P]] : [[pa, P, v.to], [pb, v.to, P]];
    legs.forEach(([plane, a, b], k) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, o = k ? -0.2 : 0.2;
      const p = [[a[0] - dy / L * o, a[1] + dx / L * o], [b[0] - dy / L * o, b[1] + dx / L * o]];
      band(plane, p, 0.18);
      cline(plane, p, `Predicted return current · in ${plane}, ${k ? 'back from' : 'out to'} the ${via}`);
    });
    if (v.kind === 'cap')
      lines.push(`<line class="rcap" x1="${v.pads[0][0]}" y1="${v.pads[0][1]}" x2="${v.pads[1][0]}" y2="${v.pads[1][1]}" data-tip="${esc(`Return crosses between the planes through ${v.cap}`)}"/>`);
    const Q = v.to, col = v.sev === 'FAIL' ? 'var(--fail)' : v.sev === 'WARN' ? 'var(--warn)' : 'var(--muted)';
    const tip = v.kind === 'cap' ? `Return through ${v.cap}` : `Return via · ${v.via_net}, joins ${pa} and ${pb} · ${v.d.toFixed(2)} mm from the signal via`;
    marks.push(`<circle class="rvia" cx="${Q[0]}" cy="${Q[1]}" r=".34" data-tip="${esc(tip)}"/><circle class="rvia-dot" cx="${Q[0]}" cy="${Q[1]}" r=".1"/>`);
    label((P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2, `${v.d.toFixed(1)} mm`, col);
  }
  // 4. the signal path itself, on top: real width, never thinner than 2.2 px, on a dark casing
  let casing = '', sig = '';
  for (const t of D.geo.tracks) if (t.n === net) {
    const c = sigColor(t.l), p = pts(t.p), tip = esc(`Signal · ${t.l}, ${t.w} mm track`);
    casing += `<polyline class="sig-case" points="${p}"/>`;
    sig += `<polyline class="sig" stroke-width="${t.w}" style="stroke:${c}" points="${p}" data-tip="${tip}"/>`
      + `<polyline class="sig-min" style="stroke:${c}" points="${p}" data-tip="${tip}"/>`;
  }
  const vias = D.geo.vias.filter(q => q[3] === net)
    .map(q => `<circle class="svia" cx="${q[0]}" cy="${q[1]}" r="${q[2] / 2}" data-tip="Signal via"/>`).join('');

  // The glow: each plane's bands at four widths, more opaque toward the core, softened by a small
  // blur. Group opacity keeps overlapping segments from darkening where they join.
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const arr of Object.values(bands)) for (const { p, hw } of arr) for (const [x, y] of p) {
    x0 = Math.min(x0, x - hw); y0 = Math.min(y0, y - hw); x1 = Math.max(x1, x + hw); y1 = Math.max(y1, y + hw);
  }
  let s = x0 === Infinity ? '' : `<defs><filter id="heat-soften" filterUnits="userSpaceOnUse" x="${x0 - 1}" y="${y0 - 1}" `
    + `width="${x1 - x0 + 2}" height="${y1 - y0 + 2}"><feGaussianBlur stdDeviation=".09"/></filter></defs>`;
  for (const [plane, arr] of Object.entries(bands)) {
    const k = planeIdx(plane), tip = esc(`Predicted return current · in ${plane} (a model, not copper)`);
    s += `<g class="rheat" filter="url(#heat-soften)" data-tip="${tip}">` + HEAT.map(([f, a], i) => {
      const col = i === HEAT.length - 1 ? `color-mix(in srgb, var(--rp-${k}) 62%, var(--hot))` : `var(--rp-${k})`;
      return `<g style="stroke:${col}" opacity="${a}">`
        + arr.map(b => `<polyline points="${pts(b.p)}" stroke-width="${(2 * b.hw * f).toFixed(3)}"/>`).join('') + '</g>';
    }).join('') + '</g>';
  }
  g.innerHTML = s + lines.join('') + halos.join('') + casing + sig + vias + marks.join('') + labels.join('');
}

function applySel() {
  svg.classList.toggle('has-sel', !!state.sel);
  for (const el of svg.querySelectorAll('[data-net]')) el.classList.toggle('sel', el.dataset.net === state.sel);
  for (const tr of document.querySelectorAll('#table tbody tr')) tr.classList.toggle('sel', tr.dataset.net === state.sel);
  renderSelection();
  renderLegend();
}

// ---------- pan / zoom
let vb = null;
const setVB = () => {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k = vb.w / (svg.clientWidth || 1);  // board mm per screen pixel
  svg.style.setProperty('--fs-lbl', `${12 * k}px`);
  svg.style.setProperty('--fs-ref', `${10 * k}px`);
};
function fit(b, pad = 2) {
  const r = svg.getBoundingClientRect();
  let ar = r.width / r.height;
  if (!isFinite(ar) || ar <= 0) ar = 1.6;
  let w = b[2] + 2 * pad, h = b[3] + 2 * pad;
  if (w / h > ar) h = w / ar; else w = h * ar;
  vb = { x: b[0] + b[2] / 2 - w / 2, y: b[1] + b[3] / 2 - h / 2, w, h };
  setVB();
  autoFit = false;
}
// Until something zooms (wheel, drag, a selection, an issue), keep the whole board fitted, even if
// the page was first laid out while hidden; after that, resizing keeps the centre and width.
let autoFit = true;
const fitBoard = () => { fit(D.geo.bbox, 1.5); autoFit = true; };
const toUser = e => { const r = svg.getBoundingClientRect(); return { x: vb.x + (e.clientX - r.left) / r.width * vb.w, y: vb.y + (e.clientY - r.top) / r.height * vb.h }; };
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const p = toUser(e), k = Math.exp(e.deltaY * 0.0015);
  vb.x = p.x - (p.x - vb.x) * k; vb.y = p.y - (p.y - vb.y) * k; vb.w *= k; vb.h *= k; setVB();
  autoFit = false;
}, { passive: false });
let drag = null;
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', e => {
  if (drag) {
    const r = svg.getBoundingClientRect(), dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 3) {
      svg.classList.add('dragging'); vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h; setVB();
      autoFit = false;
    }
    drag.x = e.clientX; drag.y = e.clientY;
    return;
  }
  const el = e.target.closest('[data-net],[data-tip]'), tip = $('#tip');
  if (!el) { tip.style.display = 'none'; return; }
  const n = NETS[el.dataset.net];
  tip.innerHTML = el.dataset.tip && !el.classList.contains('trk') ? esc(el.dataset.tip).replace(/ · /, '<br>')
    : n ? `<b>${nice(n.net)}</b><br>${n.cls} · ${n.status} · ratio ${fmt(n.ratio)} · loop ${fmt(n.loop_area, 1)} mm²` : esc(el.dataset.tip || '');
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});
svg.addEventListener('pointerleave', () => { $('#tip').style.display = 'none'; });
svg.addEventListener('pointerup', e => {
  const wasDrag = drag && drag.moved > 3;
  drag = null; svg.classList.remove('dragging');
  if (wasDrag || e.target.closest('#sel')) return;  // clicking the selected net's drawing keeps it selected
  const el = e.target.closest('[data-net]');
  select(el ? el.dataset.net : null, false);
});
svg.addEventListener('dblclick', fitBoard);
$('#fit').onclick = fitBoard;
new ResizeObserver(() => {
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height || !vb) return;
  if (autoFit) { fitBoard(); return; }
  const cy = vb.y + vb.h / 2; vb.h = vb.w * r.height / r.width; vb.y = cy - vb.h / 2; setVB();
}).observe(svg);

// Bounding box of a net's tracks plus the return path around it (detours and return vias can reach outside).
function netBBox(net) {
  const P = [];
  for (const t of D.geo.tracks) if (t.n === net) P.push(...t.p);
  for (const v of D.overlays.voids) if (v.net === net) for (const d of v.detours) P.push(...d);
  for (const v of D.overlays.vias) if (v.net === net && v.to) P.push(v.to);
  if (!P.length) return null;
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  return [x0, y0, Math.max(...xs) - x0, Math.max(...ys) - y0];
}

function select(net, zoom) {
  state.sel = net;
  if (net && zoom) {
    // show the whole net: its own layer if it has only one, otherwise all layers
    const layers = netLayers(net).filter(l => checkedLayers.includes(l));
    const want = layers.length === 1 ? layers[0] : 'all';
    if (state.view !== want) { state.view = want; buildControls(); render(); }
    const b = netBBox(net); if (b) fit(b, 3);
  }
  applySel(); renderDetail();
}

function mark(x, y) {
  const r = Math.max(vb.w / 60, 0.6);
  $('#markers').innerHTML = `<circle class="marker" cx="${x}" cy="${y}" r="${r}"/>`;
}

// ---------- detail panel
function renderDetail() {
  const n = NETS[state.sel], el = $('#detail');
  if (!n) {
    const t = D.meta.thresholds;
    el.innerHTML = `<h2>How to read this</h2>
      <p class="muted" style="margin:0 0 10px">Click a trace or a table row to see that net's signal path (solid) and its predicted return path: a soft glow in the colour of the plane that carries it, brightest where the current is densest. Each layer view shows one signal layer over its reference plane.</p>
      <dl class="stats">
        <dt>Return length</dt><dd>trace + void detours + via transfers</dd>
        <dt>Ratio</dt><dd>return ÷ trace (1.00 = ideal)</dd>
        <dt>Loop area</dt><dd>trace×h + detour areas + via loops</dd>
        <dt>Void FAIL</dt><dd class="num">detour &gt; ${t.max_detour} mm</dd>
        <dt>Via FAIL</dt><dd class="num">return via &gt; ${t.max_stitch} mm</dd>
        <dt>Edge warning</dt><dd class="num">plane edge &lt; w/2 + ${t.edge_k}h</dd>
      </dl>
      <p class="muted" style="margin:0;font-size:12.5px">Low-speed nets are capped at WARN and static nets at INFO.</p>`;
    return;
  }
  const iss = D.issues.filter(i => i.net === n.net).sort((a, b) => SEV[a.severity] - SEV[b.severity]);
  const byLayer = Object.entries(n.sig_by_layer || {}).sort((a, b) => LAYER_ORDER(a[0]) - LAYER_ORDER(b[0]));
  const byPlane = Object.entries(n.under_by_plane || {}).sort((a, b) => planeIdx(a[0]) - planeIdx(b[0]));
  const sub = (label, v, swatch = '') => `<dt class="sub">${swatch}${label}</dt><dd class="sub">${v}</dd>`;
  el.innerHTML = `<div class="name">${nice(n.net)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
      <span class="badge b-${n.status}">${n.status}</span>
      <span class="badge" style="color:var(--c-${n.cls})">${n.cls}</span>
      ${n.netclass !== 'Default' ? `<span class="badge muted">${esc(n.netclass)}</span>` : ''}
    </div>
    ${state.show.returns ? '<p class="explain">On the board: solid line = signal path; glow = predicted return current.</p>' : ''}
    <dl class="stats num">
      <dt>Signal path</dt><dd>${fmt(n.length)} mm</dd>
      ${byLayer.map(([l, v]) => sub(`on ${esc(l)}`, fmt(v), `<i class="sw" style="border-color:${sigColor(l)}"></i>`)).join('')}
      <dt>Return path</dt><dd>${n.return_est == null ? 'no local return' : fmt(n.return_est) + ' mm'}</dd>
      ${byPlane.map(([p, v]) => sub(`under trace, ${esc(p)}`, fmt(v), `<i class="heat sm" style="--c:${planeVar(p)}"></i>`)).join('')}
      ${n.unref >= 0.01 ? sub('across gaps, no plane', fmt(n.unref)) : ''}
      ${n.void_extra >= 0.01 ? sub('extra around gaps', '+' + fmt(n.void_extra)) : ''}
      ${n.transitions ? sub(`via transfers (${n.transitions})`, '+' + fmt(n.via_extra)) : ''}
      ${n.worst_stitch != null ? sub('worst via distance', fmt(n.worst_stitch)) : ''}
      <dt>Ratio</dt><dd>${n.ratio == null ? '–' : fmt(n.ratio) + '×'}</dd>
      <dt>Loop area</dt><dd>${fmt(n.loop_area, 1)} mm²</dd>
      ${sub('under trace', fmt(n.area_ref, 1))}${sub('around gaps', fmt(n.area_void, 1))}${sub('via transfers', fmt(n.area_via, 1))}
      <dt>Near plane edge</dt><dd>${fmt(n.edge)} mm</dd>
    </dl>
    <h2 style="margin-top:4px">Issues <span class="muted">(${iss.length})</span></h2>
    <ul class="issues">${iss.map((i, k) => `<li class="${i.x != null ? 'go' : ''}" data-k="${k}">
        <span class="badge b-${i.severity}">${i.severity}</span><span class="kind">${i.kind}</span><span class="muted">${esc(i.layer)}</span><br>${esc(i.msg)}${i.raw !== i.severity ? ` <span class="muted">(${i.raw} before class cap)</span>` : ''}</li>`).join('') || '<li class="muted">No issues</li>'}</ul>
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="zoomnet">Zoom to net</button><button class="btn" id="clearsel">Clear</button></div>`;
  el.querySelector('.issues').onclick = e => {
    const li = e.target.closest('li.go'); if (!li) return;
    const i = iss[+li.dataset.k];
    fit([i.x - 3, i.y - 3, 6, 6], 0); mark(i.x, i.y);
  };
  $('#zoomnet').onclick = () => select(n.net, true);
  $('#clearsel').onclick = () => select(null, false);
}

// ---------- table
const COLS = [
  ['status', 'Status'], ['net', 'Net'], ['cls', 'Class'],
  ['length', 'Track (mm)', 1], ['return_est', 'Return (mm)', 1], ['ratio', 'Return : track', 1],
  ['loop_area', 'Loop area (mm²)', 1], ['voids', 'Voids', 1], ['transitions', 'Layer changes', 1], ['worst_stitch', 'Worst via return (mm)', 1],
];
const maxRatio = Math.max(1.2, ...D.nets.map(n => n.ratio || 1));

function sortVal(n, k) {
  if (k === 'status') return SEV[n.status];
  if (k === 'cls') return CLASSES.indexOf(n.cls);
  if (k === 'ratio' && n.ratio == null) return Infinity;
  if (k === 'return_est' && n.return_est == null) return Infinity;
  return n[k];
}

function buildFilters() {
  const cnt = (k, v) => D.nets.filter(n => n[k] === v).length;
  const cls = CLASSES.filter(c => cnt('cls', c)).map(c =>
    `<button class="chip" data-f="cls" data-v="${c}" aria-pressed="${state.cls.has(c)}"><i class="dot" style="background:var(--c-${c})"></i>${c}<span class="c">${cnt('cls', c)}</span></button>`);
  const st = ['FAIL', 'WARN', 'OK'].filter(s => cnt('status', s)).map(s =>
    `<button class="chip" data-f="status" data-v="${s}" aria-pressed="${state.status.has(s)}"><span class="b-${s}" style="font-weight:650">${s}</span><span class="c">${cnt('status', s)}</span></button>`);
  $('#filters').innerHTML = st.join('') + '<span style="width:8px"></span>' + cls.join('') +
    `<input type="search" id="q" placeholder="Filter nets" value="${esc(state.q)}" style="margin-left:auto">`;
  $('#filters').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const set = state[b.dataset.f]; set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v);
    buildFilters(); renderTable();
  };
  $('#q').oninput = e => { state.q = e.target.value; renderTable(); };
}

function renderTable() {
  const { key, dir } = state.sort;
  $('#table thead').innerHTML = '<tr>' + COLS.map(([k, l, r]) =>
    `<th data-k="${k}" class="${r ? 'r' : ''}" ${k === key ? `aria-sort="${dir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}${k === key ? (dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('') + '</tr>';
  const q = state.q.toLowerCase();
  const rows = D.nets.filter(n => (!state.cls.size || state.cls.has(n.cls)) && (!state.status.size || state.status.has(n.status))
    && (!q || n.net.toLowerCase().includes(q)))
    .sort((a, b) => {
      const va = sortVal(a, key), vb2 = sortVal(b, key);
      if (va < vb2) return -dir; if (va > vb2) return dir;
      return SEV[a.status] - SEV[b.status] || (b.ratio || 9) - (a.ratio || 9);
    });
  $('#table tbody').innerHTML = rows.map(n => {
    const w = n.ratio == null ? 100 : Math.max(2, (n.ratio - 1) / (maxRatio - 1) * 100);
    const barC = n.ratio == null ? 'var(--fail)' : `var(--${n.status === 'OK' ? 'ok' : n.status.toLowerCase()})`;
    return `<tr data-net="${esc(n.net)}">
      <td><span class="badge b-${n.status}">${n.status}</span></td>
      <td>${nice(n.net)}${n.netclass !== 'Default' ? ` <span class="muted">${esc(n.netclass)}</span>` : ''}</td>
      <td><span class="cls"><i class="dot" style="background:var(--c-${n.cls})"></i>${n.cls}</span></td>
      <td class="r num">${fmt(n.length)}</td>
      <td class="r num">${n.return_est == null ? '<span style="color:var(--fail)">open</span>' : fmt(n.return_est)}</td>
      <td class="r num"><span class="ratio">${n.ratio == null ? '–' : fmt(n.ratio) + '×'}<span class="bar"><i style="width:${w}%;background:${barC}"></i></span></span></td>
      <td class="r num">${fmt(n.loop_area, 1)}</td>
      <td class="r num">${n.voids || '–'}</td>
      <td class="r num">${n.transitions || '–'}</td>
      <td class="r num">${n.worst_stitch == null ? '–' : fmt(n.worst_stitch)}</td></tr>`;
  }).join('');
  $('#foot').textContent = `${rows.length} of ${D.nets.length} nets · ratio bar spans 1.00× to ${maxRatio.toFixed(2)}× · loop area is an estimate: trace length × dielectric height, plus the plan-view area between each void crossing and its detour, plus via-to-return-via distance × plane spacing.`;
  applySel();
}
$('#table thead').onclick = e => {
  const th = e.target.closest('th'); if (!th) return;
  const k = th.dataset.k;
  state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (['net', 'cls', 'status'].includes(k) ? 1 : -1) };
  renderTable();
};
$('#table tbody').onclick = e => { const tr = e.target.closest('tr'); if (tr) { select(tr.dataset.net, true); svg.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };

// ---------- keep the view across a rerun (live mode reloads the page with the new report)
const VIEW_KEY = `return-path-view:${D.meta.board}`;
function saveView() {
  try {
    sessionStorage.setItem(VIEW_KEY, JSON.stringify({
      sel: state.sel, view: state.view, colorBy: state.colorBy, show: state.show, sort: state.sort,
      cls: [...state.cls], status: [...state.status], q: state.q, vb, autoFit, scrollY: window.scrollY,
    }));
  } catch (e) { /* no storage: the rerun still works, the view just resets */ }
}
function takeSavedView() {
  try {
    const v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || 'null');
    sessionStorage.removeItem(VIEW_KEY);
    return v;
  } catch (e) { return null; }
}

const savedView = takeSavedView();
if (savedView) {
  const v = savedView;
  if (v.view === 'all' || checkedLayers.includes(v.view)) state.view = v.view;
  if (v.colorBy) state.colorBy = v.colorBy;
  Object.assign(state.show, v.show || {});
  if (v.sort) state.sort = v.sort;
  state.cls = new Set((v.cls || []).filter(c => CLASSES.includes(c)));
  state.status = new Set(v.status || []);
  state.q = v.q || '';
  if (NETS[v.sel]) state.sel = v.sel;  // the net may have gone in the rerun
}
buildControls(); render(); fitBoard(); renderDetail(); buildFilters(); renderTable();
if (savedView) {
  if (savedView.vb && !savedView.autoFit) { vb = savedView.vb; setVB(); autoFit = false; }
  requestAnimationFrame(() => window.scrollTo(0, savedView.scrollY || 0));
}

// ---------- live mode: served by `return_path_check.py --serve`, so the page can ask for a rerun
if (D.meta.live) {
  const box = $('#live'), msg = $('#live-status'), btn = $('#rerun');
  const time = iso => (iso || '').slice(11, 19);
  let running = false, lastError = '';
  box.hidden = false;
  msg.textContent = `Board saved ${time(D.meta.board_mtime)}`;
  btn.onclick = async () => {
    running = true; lastError = '';
    btn.disabled = true; btn.textContent = 'Running…'; msg.textContent = 'Re-reading the board…';
    try {
      const r = await fetch('/api/rerun', { method: 'POST', headers: { 'X-Return-Path': 'rerun' } });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
      saveView();
      location.reload();
    } catch (e) {
      running = false; lastError = `Rerun failed: ${e.message}`;
      btn.disabled = false; btn.textContent = 'Rerun';
      box.classList.add('stale'); msg.textContent = lastError;
    }
  };
  // Watch the board file so the page can say when this report is out of date.
  const poll = async () => {
    if (running) return;
    try {
      const j = await (await fetch('/api/status', { cache: 'no-store' })).json();
      const stale = j.board_mtime !== D.meta.board_mtime;
      box.classList.toggle('stale', stale || !!lastError);
      btn.classList.toggle('primary', stale);
      btn.disabled = false;
      msg.textContent = lastError || (stale ? `Board saved ${time(j.board_mtime)} · this report is out of date`
        : `Up to date with the board saved ${time(D.meta.board_mtime)}`);
    } catch (e) {
      btn.disabled = true; box.classList.add('stale');
      msg.textContent = 'Checker server not running · start it again with --serve';
    }
  };
  poll();
  setInterval(poll, 3000);
}
</script>
</body>
